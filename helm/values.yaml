model:
  env:
    MODEL_PORT: '7380'
  image:
    pullPolicy: Always
    repository: __MODEL_IMAGE_REPOSITORY__
    tag: __MODEL_IMAGE_TAG__
  name: model
  probes:
    liveness:
      initialDelaySeconds: 10
      path: /health
      periodSeconds: 10
      port: 7380
    readiness:
      initialDelaySeconds: 5
      path: /health
      periodSeconds: 5
      port: 7380
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    port: 7380
    targetPort: 7380
    type: ClusterIP
